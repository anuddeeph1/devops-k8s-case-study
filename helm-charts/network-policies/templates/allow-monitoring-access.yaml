{{- if and .Values.networkPolicies.enabled .Values.networkPolicies.policies.allowMonitoringAccess.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-allow-monitoring-access-networkpolicy
  labels:
    {{- include "network-policies.labels" . | nindent 4 }}
  annotations:
    {{- include "network-policies.annotations" . | nindent 4 }}
    policies.kyverno.io/title: "Generate Allow Monitoring Access NetworkPolicy"
    policies.kyverno.io/description: {{ .Values.networkPolicies.policies.allowMonitoringAccess.description | quote }}
spec:
  validationFailureAction: {{ .Values.kyverno.validationFailureAction }}
  background: {{ .Values.kyverno.background }}
  rules:
  - name: generate-allow-monitoring-access
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
          - Pod
          names:
          - "*"
          namespaces:
          - {{ .Values.networkPolicies.targetNamespace }}
    preconditions:
      all:
      - key: {{ `"{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"` }}
        operator: Equals
        value: {{ .Values.podLabels.monitoring }}
    generate:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      name: allow-monitoring-access
      namespace: {{ `"{{ request.object.metadata.namespace }}"` }}
      synchronize: true
      generateExisting: {{ .Values.kyverno.generateExisting }}
      data:
        metadata:
          labels:
            generated-by: kyverno
            app.kubernetes.io/managed-by: {{ .Release.Service }}
            policy-type: "monitoring-egress"
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.podLabels.monitoring }}
          policyTypes:
          - Egress
          egress:
          # Allow DNS queries (required for service discovery)
          - ports:
            - protocol: UDP
              port: {{ .Values.ports.dns }}  # 53 - DNS
            - protocol: TCP
              port: {{ .Values.ports.dns }}  # 53 - DNS
          # Allow access to Kubernetes API server (both service and direct API ports)
          - ports:
            - protocol: TCP
              port: {{ .Values.ports.k8sApi }}  # 443 - Kubernetes API service port
            - protocol: TCP
              port: 6443  # 6443 - Kubernetes API server port
{{- end }}
